<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    {% block extra_css %}{% endblock %}
    <title>{% block title %} Begin2Code {% endblock %}</title>
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background:#111827;">
        <div class="container">
            <a class="text-center navbar-brand fw-bold fs-3" href="/">Begin2Code</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px;">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-3 mt-5" style="background:#111827; color:#9ca3af;">
        © 2025 Begin2Code. All Rights Reserved.
    </footer>

    {% include 'auth_modal.html' %}
    {% block extra_js %}{% endblock %}

    <div id="toaster" 
        class="toaster" 
        style="display:none; position:fixed; top:20px; right:20px; z-index:9999; padding:15px; border-radius:8px; color:white;">
    </div>

    <style>
        .toaster.success { background-color: #28a745; }
        .toaster.error   { background-color: #dc3545; }
        .toaster.warning { background-color: #ffc107; color:#000; }
    </style>

</body>
</html>
