<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Begin2Code{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body data-show-auth="{{ 'true' if show_auth else 'false' }}">
    
    {% if auth_message %}
    <div class="auth-alert">
        {{ auth_message }}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

    <div class="login-overlay" id="loginModal">
        <div class="login-box">
            <div class="login-card" id="loginCard">

                <div class="card-face login-face">
                    <button class="close-btn" onclick="closeLogin()">×</button>

                    <div class="left-visual">
                        <img src="{{ url_for('static', filename='images/Login.png') }}">
                    </div>

                    <div class="right-form">
                        <h2>Sign In</h2>
                        <form method="post" action="{{ url_for('login') }}">
                            <input name="email" type="email" placeholder="Email" required>
                            <input name="password" type="password" placeholder="Password" required>

                            <div class="forgot-password">
                                <a href="#">Forgot Password?</a>
                            </div>
                            <button class="btn" type="submit">Sign In</button>
                        </form>

                        <p class="switch">
                            New here? <span onclick="flipAuth()">Create Account</span>
                        </p>
                    </div>
                </div>

                <div class="card-face register-face">
                    <button class="close-btn" onclick="closeLogin()">×</button>

                    <div class="left-visual">
                        <img src="{{ url_for('static', filename='images/SignUp.png') }}">
                    </div>

                    <div class="right-form">
                        <div id="registerContent" class="content-box active">
                            <h2>Create Account</h2>

                            <form onsubmit="handleRegister(event)">
                                <input name="name" type="text" placeholder="Full Name" required>
                                <input name="email" type="email" placeholder="Email" required>
                                <input name="password" type="password" placeholder="Password" required>

                                <button class="btn" type="submit">Register</button>
                            </form>
                            <div class="social-login">
                                <a href="https://myaccount.google.com/" class="social-icon google" target="_blank">
                                    <i class="fa-brands fa-google"></i>
                                </a>
                                <a href="https://github.com/" class="social-icon github" target="_blank">
                                    <i class="fa-brands fa-github"></i>
                                </a>
                                <a href="https://www.facebook.com/login" class="social-icon facebook" target="_blank">
                                    <i class="fa-brands fa-facebook-f"></i>
                                </a>
                            </div>
                            <p class="switch">
                                Already have an account? <span onclick="flipAuth()">Sign In</span>
                            </p>
                        </div>

                        <div id="verifyContent" class="content-box hidden">
                            <h2>Verify Your Email</h2>
                            <p class="timer">Time left: <span id="timer">03:00</span></p>

                            <form onsubmit="handleVerifyOTP(event)">
                                <div class="otp-box">
                                    <input maxlength="1" required>
                                    <input maxlength="1" required>
                                    <input maxlength="1" required>
                                    <input maxlength="1" required>
                                    <input maxlength="1" required>
                                    <input maxlength="1" required>
                                </div>

                                <input type="hidden" name="otp" id="otpValue">
                                <button class="btn" type="submit">Verify</button>
                            </form>
                        </div>
                    </div>  
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
