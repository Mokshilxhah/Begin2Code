{% extends "base.html" %}
{% block title %} Notes {% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block content%}
<div class="container">
    <div class="row g-4">

        {% for note in notes %}
        <div class="col-6 col-lg-3 d-flex justify-content-center">
            <div class="Notes-container">

                <div class="image-box">
                    <img src="{{ url_for('static', filename=note.image) }}"
                         alt="{{ note.name }}"
                         style="width:100%; height:100%; object-fit:cover;">
                </div>

                <div class="notes-overlay">
                    <a href="{{ url_for('static', filename=note.full) }}" 
                       class="note-badge full" target="_blank">
                        <i class="fa-solid fa-book"></i> Full Notes
                    </a>

                    <a href="{{ url_for('static', filename=note.short) }}" 
                       class="note-badge short" target="_blank">
                        <i class="fa-solid fa-file-lines"></i> Short Notes
                    </a>

                    <a href="{{ url_for('static', filename=note.mind) }}" 
                       class="note-badge mind" target="_blank">
                        <i class="fa-solid fa-brain"></i> Mind Maps
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
